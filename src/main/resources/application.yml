server:
  port: 9753
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: receipt-voice

  datasource:
    # ✅ Thêm &rewriteBatchedStatements=true để MySQL thực sự batch insert
    url: jdbc:mysql://localhost:3306/receipt_voice?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: root
    password: 'Hai14031993@@@'
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
          # ✅ Batch insert cho InvoiceImportService (~25K rows)
          batch_size: 500
        order_inserts: true
        order_updates: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd'T'HH:mm:ss
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ---------- Excel column mapping ----------
# Column indices are 0-based: A=0, B=1, C=2, D=3, E=4, F=5
excel:
  file-path: classpath:data/invoice.xlsx
  sheet-index: 0
  header-row: 0          # header row 1; data from row 2
  order-code-col: 1      # B = Invoice (= orderCode trong hệ thống)
  customer-name-col: 2   # C = Customer
  amount-col: 3          # D = Value
  invoice-col: 4         # E = F.Inv (invoice code thật)

# ---------- CORS ----------
app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5773,http://127.0.0.1:5773

# ---------- Logging ----------
logging:
  level:
    root: INFO
    com.app: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
